<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Scheduler & Recommender</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Left Pane: Timetable and Selection -->
        <div class="left-pane">
            
            <!-- Top Controls: Taken Courses & Filters -->
            <div class="top-controls">
                <div class="selection-area">
                    <input type="text" id="taken-search" placeholder="Mark course as taken (e.g. IF 100)" list="course-list">
                    <button id="add-taken-btn" class="secondary-btn">Mark Taken</button>
                </div>
                <div id="taken-list" class="tags-container"></div>
                
                <div class="filter-toggle-area">
                    <label><input type="checkbox" id="hide-grad-cb" checked> Hide Graduate Courses (5xx+)</label>
                    <label><input type="checkbox" id="hide-freshman-cb"> Mark Freshman Courses (1xx) as Taken</label>
                </div>
            </div>

            <hr>

            <h2>My Timetable</h2>
            <div class="selection-area">
                <input type="text" id="course-search" placeholder="Search course (e.g. CS 201)" list="course-list">
                <datalist id="course-list"></datalist>
                <button id="add-course-btn">Select Sections</button>
                <p class="error-msg" id="error-msg"></p>
                <p>Selected: <span id="course-count">0</span></p>
            </div>

            <!-- Timetable Grid -->
            <div class="timetable" id="timetable">
                <div class="time-header">Time / Day</div>
                <div class="day-header">Mon</div>
                <div class="day-header">Tue</div>
                <div class="day-header">Wed</div>
                <div class="day-header">Thu</div>
                <div class="day-header">Fri</div>
            </div>
            
            <button id="recommend-btn" class="primary-btn">Recommend Non-Conflicting Courses</button>
        </div>

        <!-- Right Pane: Recommendations & Excluded -->
        <div class="right-pane">
            
            <div class="excluded-section">
                <h3 style="margin-top: 0;">Explicitly Excluded</h3>
                <div id="excluded-list" class="tags-container" style="max-height: 120px; overflow-y: auto;">
                    <p class="empty-msg" style="margin:0; font-size:13px; color:#777;">No courses excluded.</p>
                </div>
            </div>

            <h2>Recommended Courses</h2>
            <div class="filter-area">
                <input type="text" id="filter-input" placeholder="Filter by code (e.g. MATH)">
            </div>
            <div class="recommendations-list" id="recommendations-list">
                <p>Select courses and click "Recommend" to see non-conflicting options here.</p>
            </div>
        </div>
    </div>

    <!-- Section Selection Modal -->
    <div id="section-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <h3 id="modal-course-title">Select Sections</h3>
            <div id="modal-sections-container"></div>
            <p id="modal-error-msg" class="error-msg"></p>
            <button id="confirm-add-btn" class="primary-btn" style="width: 100%;">Add to Timetable</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
